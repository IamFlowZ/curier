<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: stylized envelope/arrow suggesting delivery -->
  <g transform="translate(16, 18)">
    <!-- Envelope body -->
    <rect x="0" y="20" width="72" height="48" rx="6" ry="6" fill="url(#grad)" />
    <!-- Envelope flap -->
    <path d="M0 26 L36 50 L72 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Forward arrow -->
    <path d="M52 44 L66 44 M60 38 L66 44 L60 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark -->
  <text x="108" y="74" font-family="'Inter', 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="600" letter-spacing="-1" fill="#0e7490">
    Curier
  </text>
</svg>